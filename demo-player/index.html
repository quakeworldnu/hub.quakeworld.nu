<!DOCTYPE html>
<html lang="en" class="bg-[#612] text-white dark">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <script>
        // firebase default subdomains (*.web.app, *.firebaseapp.com) cannot be disabled; redirect to the custom domain
        const host = window.location.hostname;
        if (host.endsWith(".web.app") || host.endsWith(".firebaseapp.com")) {
            const { pathname, search, hash } = window.location;
            window.location.replace(`https://hub.quakeworld.nu${pathname}${search}${hash}`);
        }
    </script>
    <title>Demo Player - QuakeWorld Hub</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
    <link rel="apple-touch-icon" href="/assets/img/apple_touch_icon.png"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
    <meta name="apple-mobile-web-app-title" content="QW Hub"/>
    <link rel="canonical" href="https://hub.quakeworld.nu/demo-player/" />
    <link rel="preload" href="/assets/fonts/roboto-v20-latin-400.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<main>
    <div id="root"></div>
</main>
<script type="module" src="/src/pages/demo-player/main.tsx"></script>
</body>
</html>
